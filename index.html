<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Afinador de Guitarra</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
  :root {
    --bg: #17130f;
    --bg2: #1f1a15;
    --panel: #241e18;
    --line: #382d23;
    --brass: #c9a227;
    --brass-bright: #eac35a;
    --silver: #d9d3c4;
    --ok: #55a973;
    --warn: #d99a3a;
    --flat: #c1502e;
    --text: #f3ece1;
    --muted: #8f8375;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(ellipse at 50% -10%, #2a2119 0%, transparent 60%),
      repeating-linear-gradient(180deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 3px),
      var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', system-ui, sans-serif;
  }
  body {
    display: flex;
    justify-content: center;
    padding: clamp(14px, 3vw, 32px);
  }
  .shell {
    width: 100%;
    max-width: 460px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  @media (min-width: 900px) {
    .shell { max-width: 880px; }
    .main-grid {
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 28px;
      align-items: start;
    }
  }
  header.top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
  }
  .eyebrow {
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--brass);
    font-weight: 600;
    margin: 0 0 2px;
  }
  h1 {
    font-size: clamp(20px, 4.2vw, 26px);
    margin: 0;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .tuning-scroll {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 4px;
    scrollbar-width: none;
  }
  .tuning-scroll::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--muted);
    padding: 9px 14px;
    border-radius: 10px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    text-align: left;
    transition: border-color .15s, color .15s, background .15s;
    line-height: 1.25;
  }
  .chip .sub {
    display: block;
    font-size: 10.5px;
    font-weight: 400;
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0.02em;
    opacity: 0.75;
    margin-top: 2px;
  }
  .chip.active {
    border-color: var(--brass);
    color: var(--brass-bright);
    background: #2c2418;
  }
  .chip:focus-visible, button:focus-visible {
    outline: 2px solid var(--brass-bright);
    outline-offset: 2px;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: clamp(18px, 4vw, 26px);
  }
  .dial-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }
  .dial {
    position: relative;
    width: min(72vw, 260px);
    height: min(72vw, 260px);
  }
  @media (min-width: 900px) {
    .dial { width: 280px; height: 280px; }
  }
  .pointer {
    position: absolute;
    top: -3px;
    left: 50%;
    transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 7px solid transparent;
    border-right: 7px solid transparent;
    border-top: 11px solid var(--brass-bright);
    z-index: 3;
    filter: drop-shadow(0 0 3px rgba(234,195,90,0.5));
  }
  .ring-svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .disc {
    position: absolute;
    inset: 14%;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #2b241b, #191410 75%);
    border: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    transition: box-shadow .25s ease;
  }
  .disc.intune {
    box-shadow: 0 0 0 3px rgba(85,169,115,0.35), 0 0 30px rgba(85,169,115,0.25) inset;
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 3px rgba(85,169,115,0.35), 0 0 24px rgba(85,169,115,0.2) inset; }
    50% { box-shadow: 0 0 0 5px rgba(85,169,115,0.5), 0 0 34px rgba(85,169,115,0.35) inset; }
  }
  @media (prefers-reduced-motion: reduce) {
    .disc.intune { animation: none; }
  }
  .note-name {
    font-family: 'JetBrains Mono', monospace;
    font-size: clamp(34px, 11vw, 46px);
    font-weight: 700;
    line-height: 1;
  }
  .freq-val {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 0.02em;
  }
  .cents-val {
    font-family: 'JetBrains Mono', monospace;
    font-size: 15px;
    font-weight: 600;
    margin-top: 4px;
  }
  .meter { width: 100%; max-width: 320px; }
  .meter-track {
    position: relative;
    height: 8px;
    border-radius: 5px;
    background: linear-gradient(90deg, var(--flat), var(--warn) 30%, var(--ok) 46%, var(--ok) 54%, var(--warn) 70%, var(--flat));
    opacity: 0.35;
  }
  .meter-marker {
    position: absolute;
    top: -5px;
    width: 3px;
    height: 18px;
    background: var(--text);
    border-radius: 2px;
    transform: translateX(-50%);
    transition: left .06s linear, background .15s;
    box-shadow: 0 0 6px rgba(0,0,0,0.5);
    left: 50%;
  }
  .meter-labels {
    display: flex;
    justify-content: space-between;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    margin-top: 6px;
  }
  .status-line {
    font-size: 12px;
    color: var(--muted);
    min-height: 16px;
    text-align: center;
  }
  .strings-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-top: 18px;
  }
  @media (min-width: 900px) {
    .strings-list { margin-top: 0; }
  }
  .string-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid transparent;
    background: transparent;
    transition: background .15s, border-color .15s;
  }
  .string-row.active {
    background: #2a2318;
    border-color: var(--brass);
  }
  .string-num {
    width: 22px; height: 22px;
    border-radius: 6px;
    background: var(--bg2);
    border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--silver);
    flex: 0 0 auto;
  }
  .string-note {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 600;
    font-size: 14px;
    width: 46px;
    flex: 0 0 auto;
  }
  .string-freq {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    flex: 1;
  }
  .icon-btn {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--silver);
    width: 32px; height: 32px;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    flex: 0 0 auto;
    transition: border-color .15s, color .15s;
  }
  .icon-btn:hover { border-color: var(--brass); color: var(--brass-bright); }
  .controls { display: flex; justify-content: center; }
  .mic-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 28px;
    border-radius: 999px;
    border: none;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.02em;
    cursor: pointer;
    background: var(--brass);
    color: #1a1509;
    transition: background .15s, transform .1s;
  }
  .mic-btn:hover { background: var(--brass-bright); }
  .mic-btn:active { transform: scale(0.97); }
  .mic-btn.stop {
    background: var(--panel);
    color: var(--flat);
    border: 1px solid var(--flat);
  }
  .error-msg {
    font-size: 12.5px;
    color: var(--flat);
    text-align: center;
    background: rgba(193,80,46,0.1);
    border: 1px solid rgba(193,80,46,0.3);
    padding: 10px 14px;
    border-radius: 10px;
    display: none;
  }
  .hint {
    font-size: 11.5px;
    color: var(--muted);
    text-align: center;
    line-height: 1.5;
  }
</style>
</head>
<body>
  <div class="shell">
    <header class="top">
      <div>
        <p class="eyebrow">Afinador · Guitarra</p>
        <h1>Sintoniza cada cuerda</h1>
      </div>
    </header>

    <div class="tuning-scroll" id="chips" role="tablist" aria-label="Selecciona una afinación"></div>

    <div class="main-grid">
      <div class="panel dial-wrap">
        <div class="dial">
          <div class="pointer"></div>
          <svg class="ring-svg" viewBox="0 0 200 200">
            <circle cx="100" cy="100" r="94" fill="none" stroke="#382d23" stroke-width="1"></circle>
            <g id="ring" style="transform-origin: 100px 100px;"></g>
          </svg>
          <div class="disc" id="disc">
            <span class="note-name" id="noteName">—</span>
            <span class="freq-val" id="freqVal">— Hz</span>
            <span class="cents-val" id="centsVal">· · ·</span>
          </div>
        </div>

        <div class="meter">
          <div class="meter-track">
            <div class="meter-marker" id="meterMarker"></div>
          </div>
          <div class="meter-labels">
            <span>bemol</span><span>0</span><span>sostenido</span>
          </div>
        </div>

        <p class="status-line" id="statusLine">Presiona escuchar y toca una cuerda</p>

        <div class="controls">
          <button class="mic-btn" id="micBtn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="11" rx="3"></rect><path d="M5 10a7 7 0 0 0 14 0"></path><line x1="12" y1="19" x2="12" y2="22"></line><line x1="8" y1="22" x2="16" y2="22"></line></svg>
            <span id="micBtnLabel">Escuchar</span>
          </button>
        </div>

        <div class="error-msg" id="errorMsg"></div>

        <p class="hint">El micrófono se usa solo en tu navegador para detectar el tono; no se graba ni se envía nada.</p>
      </div>

      <div class="panel">
        <div class="strings-list" id="stringsList"></div>
      </div>
    </div>
  </div>

<script>
/* ------------------------------------------------------------------
   Datos de afinaciones (frecuencias en Hz, temperamento igual, A4=440)
   Orden de cada arreglo: cuerda 6 (más grave) -> cuerda 1 (más aguda)
------------------------------------------------------------------- */
const TUNINGS = [
  {
    id: "standard",
    label: "Estándar",
    sub: "E A D G B E",
    strings: [
      { note: "E2", freq: 82.41 },
      { note: "A2", freq: 110.0 },
      { note: "D3", freq: 146.83 },
      { note: "G3", freq: 196.0 },
      { note: "B3", freq: 246.94 },
      { note: "E4", freq: 329.63 },
    ],
  },
  {
    id: "dropd",
    label: "Drop D",
    sub: "D A D G B E",
    strings: [
      { note: "D2", freq: 73.42 },
      { note: "A2", freq: 110.0 },
      { note: "D3", freq: 146.83 },
      { note: "G3", freq: 196.0 },
      { note: "B3", freq: 246.94 },
      { note: "E4", freq: 329.63 },
    ],
  },
  {
    id: "dropcsharp",
    label: "Drop C#",
    sub: "C# G# C# F# A# D#",
    strings: [
      { note: "C#2", freq: 69.3 },
      { note: "G#2", freq: 103.83 },
      { note: "C#3", freq: 138.59 },
      { note: "F#3", freq: 185.0 },
      { note: "A#3", freq: 233.08 },
      { note: "D#4", freq: 311.13 },
    ],
  },
];

/* ------------------------------------------------------------------
   Detección de tono por autocorrelación (ACF con interpolación parabólica)
------------------------------------------------------------------- */
function autoCorrelate(buf, sampleRate) {
  const SIZE = buf.length;
  let rms = 0;
  for (let i = 0; i < SIZE; i++) rms += buf[i] * buf[i];
  rms = Math.sqrt(rms / SIZE);
  if (rms < 0.012) return -1;

  let r1 = 0;
  let r2 = SIZE - 1;
  const thres = 0.2;
  for (let i = 0; i < SIZE / 2; i++) {
    if (Math.abs(buf[i]) < thres) { r1 = i; break; }
  }
  for (let i = 1; i < SIZE / 2; i++) {
    if (Math.abs(buf[SIZE - i]) < thres) { r2 = SIZE - i; break; }
  }

  const trimmed = buf.slice(r1, r2);
  const newSize = trimmed.length;
  if (newSize < 8) return -1;

  const c = new Array(newSize).fill(0);
  for (let i = 0; i < newSize; i++) {
    for (let j = 0; j < newSize - i; j++) {
      c[i] += trimmed[j] * trimmed[j + i];
    }
  }

  let d = 0;
  while (d + 1 < newSize && c[d] > c[d + 1]) d++;

  let maxval = -1;
  let maxpos = -1;
  for (let i = d; i < newSize; i++) {
    if (c[i] > maxval) { maxval = c[i]; maxpos = i; }
  }
  let T0 = maxpos;
  if (T0 <= 0) return -1;

  if (T0 > 0 && T0 < newSize - 1) {
    const x1 = c[T0 - 1];
    const x2 = c[T0];
    const x3 = c[T0 + 1];
    const a = (x1 + x3 - 2 * x2) / 2;
    const b = (x3 - x1) / 2;
    if (a) T0 = T0 - b / (2 * a);
  }

  const freq = sampleRate / T0;
  if (!isFinite(freq) || freq <= 0) return -1;
  return freq;
}

function matchString(freq, strings) {
  let best = null;
  strings.forEach((s, i) => {
    const n = Math.round(Math.log2(freq / s.freq));
    const adjusted = s.freq * Math.pow(2, n);
    const cents = 1200 * Math.log2(freq / adjusted);
    if (!best || Math.abs(cents) < Math.abs(best.cents)) {
      best = { cents, stringIndex: i };
    }
  });
  return best;
}

const clamp = (v, min, max) => Math.min(max, Math.max(min, v));

function statusColor(cents) {
  const a = Math.abs(cents);
  if (a <= 3) return "var(--ok)";
  if (a <= 15) return "var(--warn)";
  return "var(--flat)";
}

/* ------------------------------------------------------------------
   Estado
------------------------------------------------------------------- */
let tuningId = "standard";
let isListening = false;
let detected = null; // {freq, cents, stringIndex}

let audioCtx = null;
let stream = null;
let source = null;
let analyser = null;
let buffer = null;
let rafId = null;
let rotation = 0;
let lastTick = 0;
let lastStateUpdate = 0;
const reducedMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ------------------------------------------------------------------
   Referencias DOM
------------------------------------------------------------------- */
const chipsEl = document.getElementById("chips");
const ringEl = document.getElementById("ring");
const discEl = document.getElementById("disc");
const noteNameEl = document.getElementById("noteName");
const freqValEl = document.getElementById("freqVal");
const centsValEl = document.getElementById("centsVal");
const meterMarkerEl = document.getElementById("meterMarker");
const statusLineEl = document.getElementById("statusLine");
const micBtn = document.getElementById("micBtn");
const micBtnLabel = document.getElementById("micBtnLabel");
const errorMsgEl = document.getElementById("errorMsg");
const stringsListEl = document.getElementById("stringsList");

function currentTuning() {
  return TUNINGS.find((t) => t.id === tuningId);
}

/* ------------------------------------------------------------------
   Construcción del anillo tipo "strobe"
------------------------------------------------------------------- */
function buildRing() {
  const svgNS = "http://www.w3.org/2000/svg";
  const total = 60;
  for (let i = 0; i < total; i++) {
    const angle = (i * 360) / total;
    const major = i % 5 === 0;
    const rOuter = 94;
    const rInner = major ? 78 : 85;
    const rad = (angle * Math.PI) / 180;
    const x1 = 100 + rInner * Math.sin(rad);
    const y1 = 100 - rInner * Math.cos(rad);
    const x2 = 100 + rOuter * Math.sin(rad);
    const y2 = 100 - rOuter * Math.cos(rad);
    const line = document.createElementNS(svgNS, "line");
    line.setAttribute("x1", x1);
    line.setAttribute("y1", y1);
    line.setAttribute("x2", x2);
    line.setAttribute("y2", y2);
    line.setAttribute("stroke", major ? "var(--brass-bright)" : "var(--silver)");
    line.setAttribute("stroke-width", major ? 2.4 : 1.2);
    line.setAttribute("opacity", major ? 0.9 : 0.35);
    line.setAttribute("stroke-linecap", "round");
    ringEl.appendChild(line);
  }
}

/* ------------------------------------------------------------------
   Render de chips de afinación y lista de cuerdas
------------------------------------------------------------------- */
function renderChips() {
  chipsEl.innerHTML = "";
  TUNINGS.forEach((t) => {
    const btn = document.createElement("button");
    btn.className = "chip" + (t.id === tuningId ? " active" : "");
    btn.setAttribute("role", "tab");
    btn.setAttribute("aria-selected", t.id === tuningId ? "true" : "false");
    btn.innerHTML = t.label + '<span class="sub">' + t.sub + "</span>";
    btn.addEventListener("click", () => {
      tuningId = t.id;
      detected = null;
      renderChips();
      renderStrings();
      updateDialUI();
    });
    chipsEl.appendChild(btn);
  });
}

function renderStrings() {
  const tuning = currentTuning();
  stringsListEl.innerHTML = "";
  tuning.strings.forEach((s, i) => {
    const stringNum = 6 - i;
    const row = document.createElement("div");
    row.className = "string-row";
    row.dataset.index = i;

    const num = document.createElement("span");
    num.className = "string-num";
    num.textContent = stringNum;

    const note = document.createElement("span");
    note.className = "string-note";
    note.textContent = s.note;

    const freq = document.createElement("span");
    freq.className = "string-freq";
    freq.textContent = s.freq.toFixed(2) + " Hz";

    const btn = document.createElement("button");
    btn.className = "icon-btn";
    btn.setAttribute("aria-label", "Reproducir nota de referencia " + s.note);
    btn.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>';
    btn.addEventListener("click", () => playReference(s.freq));

    row.appendChild(num);
    row.appendChild(note);
    row.appendChild(freq);
    row.appendChild(btn);
    stringsListEl.appendChild(row);
  });
}

/* ------------------------------------------------------------------
   Actualización visual del dial, medidor y lista
------------------------------------------------------------------- */
function updateDialUI() {
  const tuning = currentTuning();
  const cents = detected ? clamp(detected.cents, -50, 50) : 0;
  const meterPct = ((cents + 50) / 100) * 100;
  const color = detected ? statusColor(detected.cents) : "var(--muted)";
  const inTune = detected && Math.abs(detected.cents) <= 3;
  const activeIdx = detected ? detected.stringIndex : -1;
  const activeNote = detected ? tuning.strings[detected.stringIndex].note : "—";

  noteNameEl.textContent = activeNote;
  noteNameEl.style.color = color;
  freqValEl.textContent = detected ? detected.freq.toFixed(2) + " Hz" : "— Hz";

  if (detected) {
    centsValEl.textContent = inTune
      ? "Afinada ✓"
      : (detected.cents > 0 ? "+" : "") + detected.cents.toFixed(0) + "¢";
  } else {
    centsValEl.textContent = "· · ·";
  }
  centsValEl.style.color = color;

  meterMarkerEl.style.left = meterPct + "%";
  meterMarkerEl.style.background = color;

  discEl.classList.toggle("intune", !!inTune);

  if (!isListening) {
    statusLineEl.textContent = "Presiona escuchar y toca una cuerda";
  } else if (detected) {
    statusLineEl.textContent = "Cuerda detectada — ajusta la clavija hasta centrar el indicador";
  } else {
    statusLineEl.textContent = "Esperando una señal clara…";
  }

  document.querySelectorAll(".string-row").forEach((row) => {
    const idx = Number(row.dataset.index);
    const isActive = isListening && idx === activeIdx;
    row.classList.toggle("active", isActive);
    const noteEl = row.querySelector(".string-note");
    noteEl.style.color = isActive ? color : "var(--text)";
  });
}

/* ------------------------------------------------------------------
   Audio: detección de tono y tono de referencia
------------------------------------------------------------------- */
function ensureAudioCtx() {
  if (!audioCtx) {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    audioCtx = new Ctx();
  }
  return audioCtx;
}

function tick(now) {
  if (!analyser || !audioCtx) return;

  analyser.getFloatTimeDomainData(buffer);
  const freq = autoCorrelate(buffer, audioCtx.sampleRate);

  const dt = Math.min((now - (lastTick || now)) / 1000, 0.05);
  lastTick = now;

  if (freq > 0 && freq < 1200) {
    const match = matchString(freq, currentTuning().strings);

    if (!reducedMotion) {
      const speed = clamp(match.cents, -50, 50) * 4.5;
      rotation += speed * dt;
      ringEl.style.transform = "rotate(" + rotation + "deg)";
    }

    if (now - lastStateUpdate > 70) {
      lastStateUpdate = now;
      detected = { freq: freq, cents: match.cents, stringIndex: match.stringIndex };
      updateDialUI();
    }
  } else {
    if (now - lastStateUpdate > 200) {
      lastStateUpdate = now;
      detected = null;
      updateDialUI();
    }
  }

  rafId = requestAnimationFrame(tick);
}

async function startListening() {
  errorMsgEl.style.display = "none";
  try {
    const ctx = ensureAudioCtx();
    if (ctx.state === "suspended") await ctx.resume();

    stream = await navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation: false,
        noiseSuppression: false,
        autoGainControl: false,
        channelCount: 1,
      },
    });

    source = ctx.createMediaStreamSource(stream);
    analyser = ctx.createAnalyser();
    analyser.fftSize = 4096;
    source.connect(analyser);
    buffer = new Float32Array(analyser.fftSize);

    isListening = true;
    micBtn.classList.add("stop");
    micBtnLabel.textContent = "Detener";
    micBtn.querySelector("svg").outerHTML =
      '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"></rect></svg>';

    lastTick = performance.now();
    rafId = requestAnimationFrame(tick);
    updateDialUI();
  } catch (err) {
    errorMsgEl.textContent = "No se pudo acceder al micrófono. Revisa los permisos del navegador e inténtalo de nuevo.";
    errorMsgEl.style.display = "block";
  }
}

function stopListening() {
  if (rafId) cancelAnimationFrame(rafId);
  rafId = null;
  if (stream) {
    stream.getTracks().forEach((t) => t.stop());
    stream = null;
  }
  if (source) { try { source.disconnect(); } catch (e) {} source = null; }
  if (analyser) { try { analyser.disconnect(); } catch (e) {} analyser = null; }

  isListening = false;
  detected = null;
  micBtn.classList.remove("stop");
  micBtnLabel.textContent = "Escuchar";
  micBtn.querySelector("svg").outerHTML =
    '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="11" rx="3"></rect><path d="M5 10a7 7 0 0 0 14 0"></path><line x1="12" y1="19" x2="12" y2="22"></line><line x1="8" y1="22" x2="16" y2="22"></line></svg>';
  updateDialUI();
}

function playReference(freq) {
  const ctx = ensureAudioCtx();
  if (ctx.state === "suspended") ctx.resume();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = "sine";
  osc.frequency.value = freq;
  const t0 = ctx.currentTime;
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.exponentialRampToValueAtTime(0.22, t0 + 0.03);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.4);
  osc.connect(gain).connect(ctx.destination);
  osc.start(t0);
  osc.stop(t0 + 1.45);
}

micBtn.addEventListener("click", () => {
  if (!isListening) startListening();
  else stopListening();
});

/* ------------------------------------------------------------------
   Inicialización
------------------------------------------------------------------- */
buildRing();
renderChips();
renderStrings();
updateDialUI();

window.addEventListener("beforeunload", () => {
  stopListening();
  if (audioCtx) audioCtx.close().catch(() => {});
});
</script>
